services:
  # Backend API Service (Free Tier)
  # WARNING: Free tier does NOT support persistent disks
  # Database will be reset on each deploy. For production use:
  # - Upgrade to Starter plan ($7/mo) with disk support, OR
  # - Use Render's free PostgreSQL database (see RENDER_DEPLOYMENT.md)
  - type: web
    name: annual-plan-review-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install && npm run init-db
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_PATH
        value: ./db/apr.db
      - key: CORS_ORIGIN
        sync: false
    # Disk configuration - ONLY available on paid plans (Starter or higher)
    # Uncomment the section below if you upgrade to a paid plan:
    # disk:
    #   name: sqlite-data
    #   mountPath: /opt/render/project/src/backend/db
    #   sizeGB: 1

  # Static Site Service (Optional - for hosting the frontend separately)
