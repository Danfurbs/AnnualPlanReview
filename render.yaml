databases:
  # PostgreSQL Database (Free Tier with Persistence)
  # This is the RECOMMENDED option for production deployment
  - name: annual-plan-review-db
    databaseName: annual_plan_review
    plan: free
    region: oregon

services:
  # Backend API Service (Free Tier)
  # Uses PostgreSQL database by default for persistent storage
  - type: web
    name: annual-plan-review-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install && npm run init-db-pg
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: USE_POSTGRESQL
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: annual-plan-review-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
  # ALTERNATIVE: SQLite with Persistent Disk (Paid Tier Only)
  # Uncomment the entire section below and comment out the PostgreSQL configuration above
  # if you prefer SQLite with a paid plan ($7/mo Starter or higher)
  # - type: web
  #   name: annual-plan-review-backend
  #   env: node
  #   region: oregon
  #   plan: starter  # Change to 'starter' or higher
  #   buildCommand: cd backend && npm install && npm run init-db
  #   startCommand: cd backend && npm start
  #   healthCheckPath: /api/health
  #   envVars:
