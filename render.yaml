databases:
  # PostgreSQL Database (Free Tier with Persistence)
  - name: annual-plan-review-db
    databaseName: annual_plan_review
    plan: free
    region: oregon

services:
  # Backend API Service (Free Tier)
  - type: web
    name: annual-plan-review-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm run init-db-pg && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: USE_POSTGRESQL
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: annual-plan-review-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
