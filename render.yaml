services:
  # Backend API Service
  - type: web
    name: annual-plan-review-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install && npm run init-db
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_PATH
        value: ./db/apr.db
      - key: CORS_ORIGIN
        sync: false
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/backend/db
      sizeGB: 1

